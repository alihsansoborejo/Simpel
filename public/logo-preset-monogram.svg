<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="monoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#monoEmerald)" stroke="url(#monoGold)" stroke-width="5" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
  
  <!-- Stylized Monogram AI (Al Ihsan) -->
  <text x="100" y="118" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="64" font-weight="900" fill="url(#monoGold)" text-anchor="middle" letter-spacing="-2">IH</text>
  
  <!-- Crown / Star on top -->
  <polygon points="100,42 103,50 112,50 105,55 107,63 100,58 93,63 95,55 88,50 97,50" fill="url(#monoGold)" />

  <!-- Lower Arc Banner -->
  <text x="100" y="152" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="1">SOBOREJO</text>
</svg>
