<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring (Gold) -->
  <circle cx="100" cy="100" r="94" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#glow)" />
  
  <!-- Inner Decorative Dashed Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7" />

  <!-- Stars of LP Ma'arif (9 Stars Arc) -->
  <!-- Top Center Big Star -->
  <polygon points="100,22 103,31 112,31 105,37 107,46 100,41 93,46 95,37 88,31 97,31" fill="url(#goldGrad)" />
  <!-- Left Stars -->
  <polygon points="76,28 78,34 84,34 79,38 81,44 76,40 71,44 73,38 68,34 74,34" fill="url(#goldGrad)" transform="scale(0.8) translate(22, 5)" />
  <polygon points="56,40 58,45 63,45 59,49 61,54 56,51 51,54 53,49 49,45 54,45" fill="url(#goldGrad)" transform="scale(0.8) translate(15, 10)" />
  <polygon points="40,58 42,63 47,63 43,67 45,72 40,69 35,72 37,67 33,63 38,63" fill="url(#goldGrad)" transform="scale(0.8) translate(10, 18)" />
  <polygon points="30,80 32,85 37,85 33,89 35,94 30,91 25,94 27,89 23,85 28,85" fill="url(#goldGrad)" transform="scale(0.8) translate(7, 26)" />
  <!-- Right Stars -->
  <polygon points="124,28 126,34 132,34 127,38 129,44 124,40 119,44 121,38 116,34 122,34" fill="url(#goldGrad)" transform="scale(0.8) translate(30, 5)" />
  <polygon points="144,40 146,45 151,45 147,49 149,54 144,51 139,54 141,49 137,45 142,45" fill="url(#goldGrad)" transform="scale(0.8) translate(36, 10)" />
  <polygon points="160,58 162,63 167,63 163,67 165,72 160,69 155,72 157,67 153,63 158,63" fill="url(#goldGrad)" transform="scale(0.8) translate(40, 18)" />
  <polygon points="170,80 172,85 177,85 173,89 175,94 170,91 165,94 167,89 163,85 168,85" fill="url(#goldGrad)" transform="scale(0.8) translate(43, 26)" />

  <!-- Center Shield -->
  <path d="M60,68 L140,68 C140,115 100,135 100,135 C100,135 60,115 60,68 Z" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Open Book (Kitab Suci / Al-Qur'an) -->
  <path d="M70,88 C82,82 96,84 100,90 C104,84 118,82 130,88 C128,108 104,106 100,112 C96,106 72,108 70,88 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5" />
  <path d="M100,90 L100,112" stroke="#047857" stroke-width="1.5" />

  <!-- Ray / Pen (Pena Ilmu) -->
  <path d="M98,62 L102,62 L100,52 Z" fill="url(#goldGrad)" />
  <circle cx="100" cy="50" r="2.5" fill="#fde047" />

  <!-- Text Banner / Ribbon at bottom -->
  <path d="M42,142 C70,134 130,134 158,142 L150,158 C125,152 75,152 50,158 Z" fill="url(#goldGrad)" />
  <text x="100" y="152" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#022c22" text-anchor="middle" letter-spacing="1">AL IHSAN</text>

  <!-- Circular Arch Text -->
  <text x="100" y="174" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">MI MA'ARIF SOBOREJO</text>
</svg>
